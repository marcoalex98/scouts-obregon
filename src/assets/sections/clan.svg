<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <title>Clan de Rovers - Horquilla</title>
  <!-- Background -->
  <rect width="320" height="200" fill="#FEE2E2" rx="0"/>

  <!-- Secondary: winding path / horizon at bottom -->
  <path d="M0,175 Q80,165 160,172 Q240,179 320,168" fill="none" stroke="#F87171" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
  <rect x="0" y="182" width="320" height="18" fill="#F87171" opacity="0.15"/>

  <!-- Secondary: fleur-de-lis small, navy, top-center background -->
  <g transform="translate(160,30) scale(0.55)" opacity="0.55">
    <!-- Fleur de lis simplified -->
    <path d="M0,-38 C-6,-20 -20,-18 -20,-4 C-20,8 -10,12 0,10 C10,12 20,8 20,-4 C20,-18 6,-20 0,-38 Z" fill="#0C2D5A"/>
    <path d="M0,10 C-4,22 -18,24 -18,38 L18,38 C18,24 4,22 0,10 Z" fill="#0C2D5A"/>
    <ellipse cx="-22" cy="2" rx="10" ry="20" fill="#0C2D5A" transform="rotate(-18 -22 2)"/>
    <ellipse cx="22" cy="2" rx="10" ry="20" fill="#0C2D5A" transform="rotate(18 22 2)"/>
    <rect x="-14" y="30" width="28" height="6" rx="3" fill="#0C2D5A"/>
  </g>

  <!-- MAIN FOCAL ELEMENT: Horquilla (Y-shaped wooden staff) centered -->
  <!-- Staff trunk -->
  <rect x="153" y="110" width="14" height="78" rx="7" fill="#8B5E34"/>
  <!-- Wood grain lines on trunk -->
  <line x1="156" y1="118" x2="156" y2="182" stroke="#6B4423" stroke-width="1" opacity="0.5"/>
  <line x1="161" y1="115" x2="161" y2="184" stroke="#A0714F" stroke-width="1" opacity="0.4"/>
  <!-- Left fork arm -->
  <path d="M153,118 Q138,100 118,72" fill="none" stroke="#8B5E34" stroke-width="14" stroke-linecap="round"/>
  <path d="M153,118 Q138,100 118,72" fill="none" stroke="#6B4423" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Right fork arm -->
  <path d="M167,118 Q182,100 202,72" fill="none" stroke="#8B5E34" stroke-width="14" stroke-linecap="round"/>
  <path d="M167,118 Q182,100 202,72" fill="none" stroke="#A0714F" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Fork junction blob -->
  <ellipse cx="160" cy="118" rx="12" ry="10" fill="#8B5E34"/>
  <ellipse cx="160" cy="118" rx="6" ry="5" fill="#A0714F" opacity="0.5"/>
  <!-- End caps of forks (knot look) -->
  <circle cx="118" cy="72" r="9" fill="#6B4423"/>
  <circle cx="202" cy="72" r="9" fill="#6B4423"/>
  <circle cx="160" cy="188" r="9" fill="#6B4423"/>

  <!-- Secondary: small campfire below horquilla base -->
  <g transform="translate(160, 190)">
    <!-- logs -->
    <ellipse cx="0" cy="4" rx="16" ry="4" fill="#8B5E34"/>
    <line x1="-10" y1="2" x2="10" y2="6" stroke="#6B4423" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="2" x2="-10" y2="6" stroke="#6B4423" stroke-width="2.5" stroke-linecap="round"/>
    <!-- flames -->
    <path d="M-4,2 Q-6,-7 0,-14 Q6,-7 4,2 Z" fill="#F97316"/>
    <path d="M-6,2 Q-8,-4 -3,-10 Q0,-5 -2,2 Z" fill="#FCD34D"/>
    <path d="M6,2 Q8,-4 3,-10 Q0,-5 2,2 Z" fill="#FCD34D"/>
  </g>

  <!-- Secondary: heart to the right -->
  <path d="M252,105 C252,99 244,94 240,100 C236,94 228,99 228,105 C228,114 240,122 240,122 C240,122 252,114 252,105 Z" fill="#DC2626" opacity="0.7"/>
</svg>
